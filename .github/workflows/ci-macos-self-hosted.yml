name: Gabenglish CI (temporary Mac runner)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gabenglish-mac-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    # Manual-only; never schedule untrusted public pull-request code on a personal Mac.
    runs-on: [self-hosted, macOS, gabenglish-mac]
    timeout-minutes: 45
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          command -v brew
          command -v node
          command -v pnpm
          node --version
          pnpm --version
          brew --prefix postgresql@16

      - name: Start local PostgreSQL 16
        shell: bash
        run: |
          set -euo pipefail
          PG_BIN="$(brew --prefix postgresql@16)/bin"
          echo "$PG_BIN" >> "$GITHUB_PATH"
          export PATH="$PG_BIN:$PATH"
          brew services start postgresql@16
          for attempt in {1..30}; do
            if pg_isready; then
              break
            fi
            sleep 2
          done
          pg_isready

          # Use the local Unix socket for administration, then a local TCP URL for tests.
          DB_USER="$(whoami)"
          if ! psql -d postgres -tAc "SELECT 1 FROM pg_roles WHERE rolname = '$DB_USER'" | grep -q 1; then
            createuser "$DB_USER"
          fi
          psql -d postgres -v ON_ERROR_STOP=1 -c "ALTER ROLE \"$DB_USER\" WITH LOGIN PASSWORD 'gabenglish_ci_local'"
          if ! psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = 'gabenglish_test'" | grep -q 1; then
            createdb -O "$DB_USER" gabenglish_test
          fi
          echo "DATABASE_URL=postgres://$DB_USER:gabenglish_ci_local@localhost:5432/gabenglish_test" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: API typecheck
        run: pnpm --filter @gabenglish/api typecheck

      - name: API tests and PostgreSQL integration tests
        run: pnpm --filter @gabenglish/api test

      - name: Shared contracts typecheck
        run: pnpm --filter @gabenglish/contracts typecheck

      - name: Shared contracts tests
        run: pnpm --filter @gabenglish/contracts test

      - name: Mobile typecheck
        run: pnpm --filter @gabenglish/mobile typecheck
