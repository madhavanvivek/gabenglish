name: Gabenglish CI
on:
  push:
    branches: [main, "foundation/**"]
  pull_request:
    branches: [main]
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gabenglish
          POSTGRES_PASSWORD: gabenglish
          POSTGRES_DB: gabenglish_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gabenglish -d gabenglish_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://gabenglish:gabenglish@localhost:5432/gabenglish_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @gabenglish/api typecheck
      - run: pnpm --filter @gabenglish/api test
      - run: pnpm --filter @gabenglish/contracts typecheck
      - run: pnpm --filter @gabenglish/contracts test
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @gabenglish/mobile typecheck
      - name: Mobile unit tests
        run: pnpm --filter @gabenglish/mobile test
      - name: Run mobile learner-settings tests
        run: pnpm --filter @gabenglish/mobile test
      - name: Export Android bundle (Expo production bundle smoke test)
        working-directory: apps/mobile
        run: pnpm exec expo export --platform android
